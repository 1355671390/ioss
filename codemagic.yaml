workflows:
  ios-workflow:
    name: iOS-USB-Control-Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Initialize Environment
        script: |
          flutter pub get
          # 强制创建一个空的 Generated.xcconfig 防止 Podfile 报错
          mkdir -p ios/Flutter
          echo "FLUTTER_ROOT=/" > ios/Flutter/Generated.xcconfig
      - name: Install Pods
        script: |
          cd ios
          rm -rf Pods
          rm -f Podfile.lock
          # 使用 --verbose 方便报错时看到最详细的原因
          pod install --repo-update --verbose
      - name: Xcode Path Patch
        script: |
          # 修正桥接文件路径
          sed -i '' 's/SWIFT_OBJC_BRIDGING_HEADER = [^;]*;/SWIFT_OBJC_BRIDGING_HEADER = Runner\/Runner-Bridging-Header.h;/g' ios/Runner.xcodeproj/project.pbxproj
          # 强制改为手动签名
          sed -i '' 's/CODE_SIGN_STYLE = Apple;/CODE_SIGN_STYLE = Manual;/g' ios/Runner.xcodeproj/project.pbxproj
      - name: Build Runner
        script: |
          # 最终的编译打包
          flutter build ios --release --no-codesign
      - name: Package IPA
        script: |
          set -e
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r Runner.ipa Payload
          mv Runner.ipa $CM_EXPORT_DIR/
    artifacts:
      - $CM_EXPORT_DIR/Runner.ipa
