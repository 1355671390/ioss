workflows:
  ios-workflow:
    name: iOS-USB-Control-Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Initialize and Fix Environment
        script: |
          flutter pub get
          # 强制生成缺失的配置文件
          mkdir -p ios/Flutter
          echo "FLUTTER_ROOT=/" > ios/Flutter/Generated.xcconfig
          touch ios/Flutter/flutter_export_environment.sh
      - name: Force Clone and Create Podspec
        script: |
          cd ios
          rm -rf peertalk_local
          # 直接克隆源码到本地
          git clone https://github.com/rsms/peertalk.git peertalk_local
          
          # 在本地目录生成 podspec，避开所有 URI 解析错误
          cat <<'EOF' > peertalk_local/peertalk.podspec
          Pod::Spec.new do |s|
            s.name             = 'peertalk'
            s.version          = '1.0.0'
            s.summary          = 'USB'
            s.homepage         = 'https://github.com/rsms/peertalk'
            s.license          = 'MIT'
            s.author           = { 'rsms' => 'rsms' }
            s.source           = { :git => 'https://github.com/rsms/peertalk.git' }
            s.source_files     = 'peertalk/*.{h,m}'
            s.public_header_files = 'peertalk/*.h'
            s.requires_arc     = true
            s.ios.deployment_target = '13.0'
          end
          EOF
      - name: Install Pods
        script: |
          cd ios
          rm -rf Pods
          rm -f Podfile.lock
          # 现在的 pod install 绝对不会报 URI 错误，因为它只读本地文件
          pod install --repo-update
      - name: Patch Xcode Project
        script: |
          # 修复桥接文件路径，让编译器知道去哪找头文件
          sed -i '' 's/SWIFT_OBJC_BRIDGING_HEADER = [^;]*;/SWIFT_OBJC_BRIDGING_HEADER = Runner\/Runner-Bridging-Header.h;/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_STYLE = Apple;/CODE_SIGN_STYLE = Manual;/g' ios/Runner.xcodeproj/project.pbxproj
      - name: Build and Package
        script: |
          flutter build ios --release --no-codesign
          set -e
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r Runner.ipa Payload
          mv Runner.ipa $CM_EXPORT_DIR/
    artifacts:
      - $CM_EXPORT_DIR/Runner.ipa
