workflows:
  ios-workflow:
    name: iOS-USB-Control-Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Prepare Pods
        script: |
          flutter clean
          rm -rf ios/Pods
          rm -f ios/Podfile.lock
          cd ios && pod install --repo-update
      - name: Fix Xcode Bridging Header Path
        script: |
          # 这一行非常关键：强制将项目设置中的桥接文件路径指向我们创建的文件
          sed -i '' 's/SWIFT_OBJC_BRIDGING_HEADER = [^;]*;/SWIFT_OBJC_BRIDGING_HEADER = Runner\/Runner-Bridging-Header.h;/g' ios/Runner.xcodeproj/project.pbxproj
      - name: Build Flutter iOS
        script: |
          # 核心编译
          flutter build ios --release --no-codesign
      - name: Export IPA
        script: |
          set -e
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r Runner.ipa Payload
          mv Runner.ipa $CM_EXPORT_DIR/
    artifacts:
      - $CM_EXPORT_DIR/Runner.ipa
