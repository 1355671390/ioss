workflows:
  ios-workflow:
    name: iOS-USB-Control-Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Initialize and Fake Config
        script: |
          flutter pub get
          # 关键：如果文件不存在，手动创建一个空文件避开 Podfile 的报错
          mkdir -p ios/Flutter
          touch ios/Flutter/Generated.xcconfig
          echo "FLUTTER_ROOT=/" > ios/Flutter/Generated.xcconfig
      - name: Install Pods
        script: |
          cd ios
          rm -rf Pods
          rm -f Podfile.lock
          pod install --repo-update
      - name: Sync Xcode Project
        script: |
          # 再次确认桥接文件引用路径正确
          sed -i '' 's/SWIFT_OBJC_BRIDGING_HEADER = [^;]*;/SWIFT_OBJC_BRIDGING_HEADER = Runner\/Runner-Bridging-Header.h;/g' ios/Runner.xcodeproj/project.pbxproj
          # 移除签名风格锁定
          sed -i '' 's/CODE_SIGN_STYLE = Apple;/CODE_SIGN_STYLE = Manual;/g' ios/Runner.xcodeproj/project.pbxproj
      - name: Final Build
        script: |
          # 使用真正的编译命令
          flutter build ios --release --no-codesign
      - name: Export IPA
        script: |
          set -e
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r Runner.ipa Payload
          mv Runner.ipa $CM_EXPORT_DIR/
    artifacts:
      - $CM_EXPORT_DIR/Runner.ipa
